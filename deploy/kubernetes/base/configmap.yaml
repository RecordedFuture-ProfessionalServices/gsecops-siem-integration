apiVersion: v1
kind: ConfigMap
metadata:
  name: rf-risklist-ingest-config
data:
  # ---------------------------------------------------------------------------
  # Google SecOps
  # ---------------------------------------------------------------------------
  # Required. SecOps customer ID, from SIEM Settings -> Profile.
  CHRONICLE_CUSTOMER_ID: ""

  # Region where the SecOps instance is located.
  CHRONICLE_REGION: "us"

  # The namespace that the SecOps logs are labeled with.
  CHRONICLE_NAMESPACE: "RAW_TELEMETRY"

  # Log type used to push data into SecOps.
  CHRONICLE_DATA_TYPE: "RECORDED_FUTURE_IOC"

  # ---------------------------------------------------------------------------
  # Recorded Future
  # ---------------------------------------------------------------------------
  # Fusion paths of the risklists to ingest. "default" uses the default
  # risklist for that entity type.
  RECORDED_FUTURE_FUSION_PATH_DOMAIN: "default"
  RECORDED_FUTURE_FUSION_PATH_IP: "default"
  RECORDED_FUTURE_FUSION_PATH_HASH: "default"
  RECORDED_FUTURE_FUSION_PATH_URL: "default"

  # Expiration time for ingested IoCs. Keep this equal to the CronJob schedule
  # in cronjob.yaml - if the job runs daily, leave it at 1d. The script adds an
  # extra hour of overlap automatically.
  RECORDED_FUTURE_OFFSET: "1d"

  # ---------------------------------------------------------------------------
  # Secrets are not set here. Each overlay supplies them one of two ways:
  #   - Google Secret Manager paths in CHRONICLE_SERVICE_ACCOUNT and
  #     RECORDED_FUTURE_SECRET (overlays/gke-workload-identity)
  #   - mounted file paths in CHRONICLE_SERVICE_ACCOUNT_FILE and
  #     RECORDED_FUTURE_SECRET_FILE (overlays/generic-kubernetes)
  # ---------------------------------------------------------------------------
