apiVersion: v1
kind: ConfigMap
metadata:
  name: rf-risklist-ingest-config
data:
  # Google Secret Manager resource paths, including the version. These are read
  # through Application Default Credentials, which Workload Identity provides.
  #
  # CHRONICLE_SERVICE_ACCOUNT holds the dedicated Chronicle API service account
  # key. Remove it to call the Chronicle API as the Workload Identity Google
  # service account instead, after granting that account Chronicle API Editor.
  CHRONICLE_SERVICE_ACCOUNT: "projects/PROJECT_ID/secrets/chronicle-service-account-key/versions/latest"
  RECORDED_FUTURE_SECRET: "projects/PROJECT_ID/secrets/recorded-future-api-token/versions/latest"
