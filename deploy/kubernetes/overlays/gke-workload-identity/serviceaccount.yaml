apiVersion: v1
kind: ServiceAccount
metadata:
  name: rf-risklist-ingest
  annotations:
    # The Google service account that holds secretmanager.secretAccessor on the
    # two secrets referenced in configmap.yaml.
    iam.gke.io/gcp-service-account: rf-ingest@PROJECT_ID.iam.gserviceaccount.com
# Workload Identity resolves credentials through the GKE metadata server, but
# mounting the projected token keeps Application Default Credentials working if
# the cluster is later switched to Workload Identity Federation.
automountServiceAccountToken: true
